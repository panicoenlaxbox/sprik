name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:run --coverage

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: build:win
          - os: ubuntu-latest
            build_cmd: build:linux
          - os: macos-latest
            build_cmd: build:mac
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - run: pnpm install

      - name: Build installer
        run: pnpm ${{ matrix.build_cmd }}

      - name: Create GitHub Release (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/latest.yml
          body: ''

      - name: Create GitHub Release (Linux)
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          body: ''

      - name: Create GitHub Release (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          body: ''
