name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'README.md'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:run --coverage

  build:
    name: Build
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    # Linux runners are cheaper and faster than Windows.
    # Cross-compiling the NSIS installer requires Wine but works fine for unsigned builds.
    # Switch to windows-latest if code signing is ever needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Wine for Windows cross-compilation
        run: sudo dpkg --add-architecture i386 && sudo apt-get update && sudo apt-get install -y wine wine32 wine64

      - run: pnpm install

      - name: Build installer
        run: pnpm build:win

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/
          retention-days: 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          # generate_release_notes: true
