name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test:run --coverage

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: build:win
            artifact_name: dist-windows
            artifact_files: dist/*.exe
          - os: ubuntu-latest
            build_cmd: build:linux
            artifact_name: dist-linux
            artifact_files: |
              dist/*.AppImage
              dist/*.deb
          - os: macos-latest
            build_cmd: build:mac
            artifact_name: dist-mac
            artifact_files: dist/*.dmg
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - run: pnpm install

      - name: Build installer
        run: pnpm ${{ matrix.build_cmd }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_files }}
          retention-days: 1

      - name: Create GitHub Release (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          body: ''

      - name: Create GitHub Release (Linux)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
          body: ''

      - name: Create GitHub Release (macOS)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.dmg
          body: ''
